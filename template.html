"<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"./support.js\"><\u002Fscript>\n</head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  /* ── ApeX Design System · tokens (backend rules the site abides by) ── */\n  :root{\n    /* Primitives */\n    --neutral-0:#000000; --neutral-200:#171717; --neutral-900:#F3F4F6; --neutral-1000:#FFFFFF;\n    --slate-500:#64748B; --slate-600:#94A3B8; --slate-700:#CBD5E1;\n    --green-500:#2E7D38;\n    --lime-400:#B4D634; --lime-450:#95D43F; --lime-500:#9EC116;\n    --gold-500:#FFB800;\n    --ember-500:#FF5100;\n    --profit-500:#00FF66;\n\n    /* Theme (aliased) */\n    --surface-canvas:var(--neutral-0);\n    --text-primary:var(--neutral-900);\n    --text-secondary:var(--slate-700);\n    --text-on-action:var(--neutral-0);\n    --text-inverse:var(--neutral-200);\n    --accent-brand:var(--lime-400);\n    --accent-signal:var(--profit-500);\n    --accent-fire:var(--gold-500);\n    --accent-heat:var(--ember-500);\n    --action-interactive:var(--profit-500);\n    --action-primary:var(--lime-450);\n    --border-subtle:rgba(255,255,255,0.10);\n    --border-hairline:rgba(255,255,255,0.18);\n    --glow-signal:rgba(0,255,102,0.55);\n\n    /* Responsive (numbers) */\n    --font-display:6vw;\n    --track-display:-0.06em;\n    --font-family-display:'Michroma',sans-serif;\n    --font-family-body:'Inter',sans-serif;\n    --font-overline:11px;\n    --track-tight:-0.02em;\n    --space-nav-y:28px; --space-nav-x:40px; --space-bottom:40px;\n    --radius-sm:4px;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;background:var(--surface-canvas)}\n  @keyframes apex-nav-down{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}\n  @keyframes apex-head-up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}\n</style>\n</helmet>\n<div ref=\"{{ scrollerRef }}\" style=\"position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--surface-canvas);font-family:var(--font-family-body);color:var(--text-primary);touch-action:none\">\n\n  <div style=\"position:absolute;inset:0;overflow:hidden\">\n    <video ref=\"{{ videoRef }}\" src=\"assets/lion.mp4\" muted playsinline style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0.35;\"></video>\n\n    <nav style=\"position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:var(--space-nav-y) var(--space-nav-x);animation:apex-nav-down 1s cubic-bezier(0.16,1,0.3,1) 0.35s both\">\n      <div style=\"font-size:22px;letter-spacing:-0.5px;display:flex;align-items:center;user-select:none;font-family:var(--font-family-display)\">\n        <span style=\"color:var(--text-primary)\">Ape</span><span style=\"color:var(--accent-fire)\">X</span>\n      </div>\n      <div style=\"display:flex;align-items:center;gap:38px\">\n        <a href=\"#\" style=\"font-size:var(--font-overline);color:var(--text-secondary);text-decoration:none;padding-bottom:4px;border-bottom:1px solid transparent;transition:color 0.35s ease,border-color 0.35s ease,text-shadow 0.35s ease\" style-hover=\"color:var(--action-interactive);border-bottom:1px solid var(--action-interactive);text-shadow:0 0 14px var(--glow-signal)\">The Manifesto</a>\n        <a href=\"#\" style=\"font-size:var(--font-overline);color:var(--text-secondary);text-decoration:none;padding-bottom:4px;border-bottom:1px solid transparent;transition:color 0.35s ease,border-color 0.35s ease,text-shadow 0.35s ease\" style-hover=\"color:var(--action-interactive);border-bottom:1px solid var(--action-interactive);text-shadow:0 0 14px var(--glow-signal)\">GreenLight</a>\n        <a href=\"#\" style=\"font-size:var(--font-overline);color:var(--text-secondary);text-decoration:none;padding-bottom:4px;border-bottom:1px solid transparent;transition:color 0.35s ease,border-color 0.35s ease,text-shadow 0.35s ease\" style-hover=\"color:var(--action-interactive);border-bottom:1px solid var(--action-interactive);text-shadow:0 0 14px var(--glow-signal)\">Base</a>\n        <a href=\"#\" style=\"font-size:var(--font-overline);color:var(--text-inverse);text-decoration:none;padding:12px 22px;border-radius:999px;background:linear-gradient(180deg,var(--neutral-1000) 0%,var(--neutral-900) 100%);border:1px solid rgba(0,0,0,0.06);box-shadow:inset 0 -10px 12px -6px rgba(46,125,56,0.35),0 1px 2px rgba(0,0,0,0.25);transition:box-shadow 0.35s ease,transform 0.35s ease\" style-hover=\"box-shadow:inset 0 -12px 14px -6px rgba(46,125,56,0.5),0 2px 6px rgba(0,0,0,0.3);transform:translateY(-1px)\">Join the Pride</a>\n      </div>\n    </nav>\n\n    <div style=\"position:absolute;left:0;right:0;bottom:var(--space-bottom);z-index:2;padding:0 28px;animation:apex-head-up 1.2s cubic-bezier(0.16,1,0.3,1) 0.6s both\">\n      <div style=\"position:relative;width:100%;text-align:center;font-size:var(--font-display);line-height:0.9;letter-spacing:var(--track-display);white-space:nowrap;font-family:var(--font-family-display);color:var(--text-primary)\">\n        <sc-for list=\"{{ chars }}\" as=\"c\" hint-placeholder-count=\"14\">\n          <span style=\"display:inline-block;white-space:pre;transform-origin:center top;transform:{{ c.transform }};opacity:{{ c.opacity }};will-change:transform, opacity\">{{ c.ch }}</span>\n        </sc-for>\n      </div>\n    </div>\n\n  </div>\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  state = { progress: 0 };\n\n  constructor(props) {\n    super(props);\n    this.scrollerRef = React.createRef();\n    this.videoRef = React.createRef();\n  }\n\n  componentDidMount() {\n    const el = this.scrollerRef.current;\n    if (!el) return;\n    this._el = el;\n    this._v = 0;\n    this._max = 900;          // virtual scroll distance for the full wipe\n    this._touchY = null;\n\n    const apply = () => {\n      const p = this.clamp(this._v / this._max, 0, 1);\n      if (p !== this.state.progress) this.setState({ progress: p });\n    };\n\n    this._onWheel = (e) => {\n      e.preventDefault();\n      this._v = this.clamp(this._v + e.deltaY, 0, this._max);\n      apply();\n    };\n    this._onTouchStart = (e) => { this._touchY = e.touches[0].clientY; };\n    this._onTouchMove = (e) => {\n      if (this._touchY == null) return;\n      const y = e.touches[0].clientY;\n      this._v = this.clamp(this._v + (this._touchY - y) * 1.6, 0, this._max);\n      this._touchY = y;\n      e.preventDefault();\n      apply();\n    };\n    this._onTouchEnd = () => { this._touchY = null; };\n\n    el.addEventListener('wheel', this._onWheel, { passive: false });\n    el.addEventListener('touchstart', this._onTouchStart, { passive: false });\n    el.addEventListener('touchmove', this._onTouchMove, { passive: false });\n    el.addEventListener('touchend', this._onTouchEnd);\n    apply();\n    \n    this._raf = null;\n    this._videoCurrentTime = 0;\n    const tick = () => {\n      if (this.videoRef.current && this.videoRef.current.duration) {\n        const vid = this.videoRef.current;\n        const target = this.state.progress * vid.duration;\n        this._videoCurrentTime += (target - this._videoCurrentTime) * 0.15;\n        if (Math.abs(vid.currentTime - this._videoCurrentTime) > 0.01) {\n            vid.currentTime = this._videoCurrentTime;\n        }\n      }\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  componentWillUnmount() {\n    const el = this._el;\n    if (!el) return;\n    el.removeEventListener('wheel', this._onWheel);\n    el.removeEventListener('touchstart', this._onTouchStart);\n    el.removeEventListener('touchmove', this._onTouchMove);\n    el.removeEventListener('touchend', this._onTouchEnd);\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n\n  clamp(v, a, b) { return Math.max(a, Math.min(v, b)); }\n\n  renderVals() {\n    const text = 'REACH THE APEX';\n    const glyphs = text.split('');\n    const N = glyphs.length;\n    const p = this.state.progress;\n    const dur = 0.28;      // how much scroll each letter takes\n    const span = 0.72;     // portion of scroll across which the wave travels\n\n    const chars = glyphs.map((ch, i) => {\n      const start = (i / N) * span;\n      const cp = this.clamp((p - start) / dur, 0, 1);\n      const ty = (cp * 140).toFixed(1);          // fall downward\n      const sx = (1 + cp * 0.06).toFixed(3);      // slight horizontal spread\n      const sy = (1 - cp * 0.45).toFixed(3);      // vertical squish\n      return {\n        ch,\n        transform: `translateY(${ty}px) scale(${sx}, ${sy})`,\n        opacity: (1 - cp).toFixed(3)\n      };\n    });\n\n    return { chars, scrollerRef: this.scrollerRef, videoRef: this.videoRef };\n  }\n}\n<\u002Fscript>\n</body>\n</html>\n"
